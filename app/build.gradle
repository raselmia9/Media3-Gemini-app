200 fd8bdec79e06689c178af050511323f9ab5e2045

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Every CI build gets a higher version code, so Android installs it as an update
def ciRunNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.rasvibe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rasvibe'
        minSdk 23
        targetSdk 35
        versionCode ciRunNumber
        versionName "1.0.${ciRunNumber}"
    }

    // Stable signing key (from GitHub Secrets). Android only updates an app when the
    // new build is signed with the same key as the installed one.
    signingConfigs {
        shared {
            if (System.getenv("RAS_KEYSTORE_PATH")) {
                storeFile file(System.getenv("RAS_KEYSTORE_PATH"))
                storePassword System.getenv("RAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RAS_KEY_ALIAS")
                keyPassword System.getenv("RAS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("RAS_KEYSTORE_PATH")) {
                signingConfig signingConfigs.shared
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3_version = '1.11.1'

    // AndroidX AppCompat
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Material Design
    implementation 'com.google.android.material:material:1.13.0'

    // Media3 ExoPlayer
    implementation "androidx.media3:media3-exoplayer:$media3_version"

    // MPEG-DASH (MPD)
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"

    // HLS (M3U8)
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"

    // Player UI
    implementation "androidx.media3:media3-ui:$media3_version"

    // Custom HTTP Headers / OkHttp
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // FFmpeg Audio Decoder
    implementation "androidx.media3:media3-decoder-ffmpeg:$media3_version"

    implementation "androidx.media3:media3-database:$media3_version"

    // Firebase Cloud Messaging (topic notifications)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    
}

