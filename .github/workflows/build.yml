
name: Build Advanced Media3 Player with FFmpeg

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Repository
        uses: actions/checkout@v4

      - name: Checkout AndroidX Media3 Source
        uses: actions/checkout@v4
        with:
          repository: androidx/media
          ref: 1.11.1
          path: media
          fetch-depth: 1
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4

      - name: Install Native Build Tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "ndk;26.1.10909125"
          sdkmanager "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Download FFmpeg 6.0
        run: |
          cd media/libraries/decoder_ffmpeg/src/main/jni
          git clone https://github.com/FFmpeg/FFmpeg.git \
            --branch release/6.0 \
            --depth 1 ffmpeg

      - name: Build FFmpeg Native Libraries
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          set -e

          FFMPEG_MODULE_PATH="$GITHUB_WORKSPACE/media/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
          HOST_PLATFORM="linux-x86_64"
          ANDROID_ABI=23

          ENABLED_DECODERS=(ac3 eac3 dca mlp truehd)

          cd "$FFMPEG_MODULE_PATH/jni"

          chmod +x build_ffmpeg.sh

          ./build_ffmpeg.sh \
            "$FFMPEG_MODULE_PATH" \
            "$NDK_PATH" \
            "$HOST_PLATFORM" \
            "$ANDROID_ABI" \
            "${ENABLED_DECODERS[@]}"

      - name: Build Android APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
            output/AdvancedMedia3Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdvancedMedia3Player-FFmpeg-APK
          path: output/AdvancedMedia3Player.apk
          if-no-files-found: error
